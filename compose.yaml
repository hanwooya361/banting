# 로컬 개발용 MySQL. 실행: docker compose up -d  /  정리: docker compose down (-v 붙이면 데이터 삭제)
# 다른 프로젝트와 겹치지 않게 포트 3310, 이름은 banting- 접두사 (docs/infra.md)
name: banting

services:
  mysql:
    image: mysql:8.4
    container_name: banting-mysql
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: banting
      MYSQL_USER: banting
      MYSQL_PASSWORD: banting-local
      MYSQL_ROOT_PASSWORD: banting-root-local
      TZ: Asia/Seoul
    volumes:
      - banting-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [banting-net]

volumes:
  banting-mysql-data:
    name: banting-mysql-data

networks:
  banting-net:
    name: banting-net
