name: CI

# PR마다, 그리고 main에 머지될 때 실행한다.
# main 브랜치 보호 규칙이 아래 두 job(backend, frontend)의 통과를 필수로 요구한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소 (러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 코드 읽기만 필요. 최소 권한 원칙
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시를 저장해 다음 실행을 빠르게 한다
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v5

      # build = 컴파일 + 테스트 + jar. 테스트가 하나라도 실패하면 job 실패
      - name: 빌드와 테스트
        run: ./gradlew build

      # 실패 원인을 볼 수 있게 테스트 리포트를 아티팩트로 남긴다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node 24 설치
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: package-lock.json 그대로 설치 (install과 달리 lock을 바꾸지 않음)
      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # build = tsc 타입체크 + vite 번들링
      - name: 빌드
        run: npm run build
