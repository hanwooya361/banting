name: CI

# PR: 테스트만 (main 브랜치 보호 규칙이 backend, frontend job 통과를 필수로 요구)
# main push(= PR 머지): 테스트 → 바뀐 쪽만 배포
# 수동 실행(workflow_dispatch): 테스트 → 양쪽 모두 배포. main에서 실행할 때만 배포 (다른 브랜치가 운영에 올라가거나 main 태그를 덮어쓰지 않게)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR은 새 커밋이 오면 이전 실행 취소. main은 배포 도중 끊기면 안 되므로 순서대로 실행
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본은 읽기만. 이미지 push가 필요한 job에서만 packages: write를 추가
permissions:
  contents: read

env:
  IMAGE: ghcr.io/hanwooya361/banting-backend

jobs:
  # ───────────── 테스트 ─────────────
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시를 저장해 다음 실행을 빠르게 한다
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v5

      # build = 컴파일 + 테스트 + jar. 테스트가 하나라도 실패하면 job 실패
      - name: 빌드와 테스트
        run: ./gradlew build

      # 실패 원인을 볼 수 있게 테스트 리포트를 아티팩트로 남긴다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node 24 설치
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: package-lock.json 그대로 설치 (install과 달리 lock을 바꾸지 않음)
      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # 상품 붙여넣기 수량 읽기(T19)처럼 금액에 쓰이는 프론트 로직 테스트. 실패하면 배포되지 않는다
      - name: 테스트
        run: npm test

      # build = tsc 타입체크 + vite 번들링
      - name: 빌드
        run: npm run build

  # ───────────── 바뀐 폴더 판별 (main push일 때만) ─────────────
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ───────────── 프론트 배포: S3 + CloudFront ─────────────
  deploy-frontend:
    needs: [backend, frontend, changes]
    # changes가 건너뛰어진 수동 실행에서도 돌도록 always() + 결과 직접 확인
    if: >-
      always() && needs.backend.result == 'success' && needs.frontend.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 파일명에 해시가 붙은 assets는 1년 캐시, index.html은 매번 새로 확인
      # 새 파일을 먼저 올린 뒤 마지막에 옛 파일을 지워서, 배포 중에도 화면이 깨지지 않게 한다
      - name: S3 업로드
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete --size-only

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: 화면 응답 확인
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "https://${{ vars.CLOUDFRONT_DOMAIN }}/"

  # ───────────── 백엔드 배포: GHCR 이미지 → EC2 (SSM) ─────────────
  deploy-backend:
    needs: [backend, frontend, changes]
    if: >-
      always() && needs.backend.result == 'success' && needs.frontend.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    # EC2가 ARM(t4g)이라 ARM 러너에서 바로 빌드 (에뮬레이션보다 빠름, 공개 저장소 무료)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # 태그: 커밋 SHA(롤백 기준) + main(서버를 켤 때 최신 이미지를 찾는 기준)
      # 서버가 꺼져 있어도 이미지는 올려 둔다 → 켜기 스크립트가 이 이미지로 맞춘다
      - name: 이미지 빌드·push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 개발 기간에는 EC2를 쓸 때만 켜므로, 꺼져 있으면 실패 대신 경고만 남기고 건너뛴다
      - name: 서버 상태 확인
        id: server
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "EC2 상태: $STATE"
          if [ "$STATE" = "running" ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            MSG="EC2가 꺼져 있어(${STATE}) 백엔드 배포를 건너뜀. 이미지(${GITHUB_SHA::7})는 GHCR에 올라감. scripts/ec2-start.ps1로 켜면 이 이미지로 맞춰짐"
            echo "::warning title=백엔드 배포 건너뜀::$MSG"
            echo "### ⚠️ 백엔드 배포 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 서버에서 이 커밋의 deploy.sh·compose를 내려받아 실행. deploy.sh가 헬스체크 실패 시 직전 이미지로 롤백
      - name: EC2 배포 (SSM)
        if: steps.server.outputs.running == 'true'
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_SHA}/deploy"
          PARAMS=$(jq -n --arg raw "$RAW" --arg sha "$GITHUB_SHA" '{commands: [
            "set -euo pipefail",
            "cd /opt/banting",
            "curl -fsSL \($raw)/deploy.sh -o deploy.sh",
            "curl -fsSL \($raw)/docker-compose.yml -o docker-compose.yml",
            "bash deploy.sh \($sha)"
          ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          # 이미지 pull + Spring 기동 + 헬스체크까지 최대 약 6분 대기
          for _ in $(seq 1 72); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]

      # 사용자와 같은 경로(CloudFront → EC2)로 한 번 더 확인
      - name: 헬스체크 (CloudFront 경유)
        if: steps.server.outputs.running == 'true'
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "https://${{ vars.CLOUDFRONT_DOMAIN }}/api/health"; then exit 0; fi
            sleep 3
          done
          echo "::error::CloudFront 경유 헬스체크 실패"
          exit 1
