# 로컬 개발: 루트의 compose.yaml로 띄운 MySQL (docker compose up -d)
# 로컬 전용 계정이라 비밀번호를 그대로 둔다. 운영 비밀번호는 서버 .env에만 있음
spring:
  config:
    # 로컬 비밀 값(카카오 키 등). 파일이 없어도 기동됨. 템플릿: application-secret.example.yml
    import: optional:file:./application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3310/banting
    username: banting
    password: banting-local

banting:
  jwt:
    # 로컬·테스트 전용 키. 운영 키는 서버 .env에만 있음
    secret: local-development-only-jwt-secret-0123456789
  images:
    # 로컬에서도 사진은 운영 CloudFront로 보여준다 (Vite 개발 서버는 /images를 모름)
    public-base-url: https://d3i3a9qd0hlqm6.cloudfront.net
    # 로컬 S3 자격 증명: aws login 세션에서 임시 키를 꺼내 쓰고 만료 전 자동 갱신 (aws가 PATH에 있어야 함)
    credentials-process: aws configure export-credentials --format process
  scheduler:
    enabled: true
  demo:
    seed: true
