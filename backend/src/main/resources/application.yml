spring:
  application:
    name: banting
  profiles:
    # 아무 프로필도 지정하지 않으면 로컬 개발용. 서버는 .env의 SPRING_PROFILES_ACTIVE=prod
    default: local
  jpa:
    # 스키마는 Flyway만 바꾼다. 엔티티와 테이블이 어긋나면 기동 시점에 실패시켜 바로 알게 함
    hibernate:
      ddl-auto: validate
    # 컨트롤러·뷰까지 DB 세션을 열어 두지 않음 (지연 로딩 쿼리가 숨어서 나가는 것 방지)
    open-in-view: false

banting:
  jwt:
    issuer: banting
    access-ttl: 30m
    refresh-ttl: 14d
    # secret은 프로필별 파일에서 (local: 개발용 고정값, prod: 서버 .env의 JWT_SECRET)
  oauth:
    # 간편 가입·로그인 (T23). 공급자는 client-id와 client-secret이 모두 있어야 켜진다 (비어 있으면 버튼이 안 보임)
    # local: backend/application-secret.yml / prod: Parameter Store → deploy.sh가 .env에 반영
    base-url: ${OAUTH_BASE_URL:http://localhost:5180}
    providers:
      kakao:
        # 카카오 로그인은 같은 앱의 REST API 키를 client_id로 쓴다 (동네 설정용 키와 같음)
        client-id: ${banting.kakao.rest-api-key:}
        client-secret: ${KAKAO_LOGIN_CLIENT_SECRET:}
        authorize-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
        scope: openid email profile
  kakao:
    # 카카오 로컬 API REST 키. 비어 있으면 동네 설정·주소 검색이 503으로 응답(앱은 정상 기동)
    # local: backend/application-secret.yml(gitignore) / prod: Parameter Store → deploy.sh가 서버 .env에 반영
    rest-api-key: ${KAKAO_REST_API_KEY:}
  toss:
    # 토스페이먼츠 시크릿 키 (서버 전용). 비어 있으면 결제 승인만 503 (앱은 정상 기동)
    # local: backend/application-secret.yml(gitignore) / prod: Parameter Store → deploy.sh가 서버 .env에 반영
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
  images:
    # 상품 사진 버킷 (비밀 아님). 업로드는 images/tmp/, 공개는 images/group-buys/ (CloudFront /images/*)
    bucket: banting-images-150604516450
    region: ap-southeast-2
    # 응답 사진 주소 앞부분. 운영은 같은 CloudFront 주소라 비워 둠(/images/…)
    public-base-url: ""
  participation:
    # 마지막 자리 잡는 방식 (T13 비교): CONDITIONAL(조건부 UPDATE, 기본) / PESSIMISTIC(SELECT … FOR UPDATE)
    seat-lock: CONDITIONAL
  settlement:
    # 정산 수수료 (만분율, 300 = 3%). 개설자 정산 총액에서 떼고 원 단위 내림 (T16)
    fee-bps: 300
  scheduler:
    # 결제 대기 만료·마감 미달 환불·refresh 토큰 정리 (T14). 테스트에선 꺼 둠 (local·prod에서 켬)
    enabled: false
  demo:
    # 체험 동네 시드 공구(T09.5). 켜면 기동 시 + 매일 04:30에 멱등 시더가 돈다. 테스트에선 꺼 둠 (local·prod에서 켬)
    seed: false

server:
  port: 8090  # 다른 프로젝트(8080)와 겹치지 않게. 포트 목록은 docs/infra.md
