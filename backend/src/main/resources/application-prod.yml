# 운영(EC2): 같은 compose 네트워크의 banting-mysql 컨테이너
# MYSQL_PASSWORD는 서버 /opt/banting/.env에서 env_file로 들어온다 (저장소에 없음)
spring:
  datasource:
    url: jdbc:mysql://banting-mysql:3306/banting
    username: banting
    password: ${MYSQL_PASSWORD}

banting:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    # 카카오·구글 콜백 주소와 로그인 후 이동 주소의 기준 (콘솔에 등록한 Redirect URI와 같아야 함, T23)
    base-url: https://d3i3a9qd0hlqm6.cloudfront.net
  scheduler:
    enabled: true
  demo:
    seed: true
