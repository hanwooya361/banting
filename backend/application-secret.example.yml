# 로컬 개발용 비밀 값 템플릿.
# 이 파일을 같은 폴더(backend/)에 application-secret.yml로 복사해 값을 채운다.
# application-secret.yml은 .gitignore에 있어 커밋되지 않는다. 운영 값은 AWS Parameter Store에만 둔다.
banting:
  kakao:
    rest-api-key: 여기에_카카오_REST_API_키
  oauth:
    # 간편 가입 (T23). 비워 두면 해당 버튼이 안 보인다. 카카오 client-id는 위 rest-api-key를 그대로 씀
    providers:
      kakao:
        client-secret: 여기에_카카오_로그인_Client_Secret
      google:
        client-id: 여기에_구글_OAuth_클라이언트_ID
        client-secret: 여기에_구글_OAuth_클라이언트_보안_비밀번호
  toss:
    # 토스페이먼츠 결제위젯 테스트 시크릿 키 (test_gsk_로 시작). 개발자센터 또는 토스 문서의 테스트 키
    secret-key: 여기에_토스_테스트_시크릿_키
